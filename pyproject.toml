[project]
name = "universal-router"
version = "0.1.0"
description = "Universal Router — 本地三协议互转网关"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "anyio>=4.3",
]

[project.scripts]
universal-router = "app.main:run"

[tool.uvicorn]
host = "127.0.0.1"
port = 8787
