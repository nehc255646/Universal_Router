[project]
name = "universal-router"
version = "0.2.0"
description = "Universal Router — 本地三协议互转网关（Chat Completions / Responses / Messages）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "anyio>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
universal-router = "app.main:run"

[project.urls]
Homepage = "https://github.com/nehc255646/Universal_Router"
Repository = "https://github.com/nehc255646/Universal_Router"

[tool.uvicorn]
host = "127.0.0.1"
port = 8787

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
