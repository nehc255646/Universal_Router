services:
  universal-router:
    build: .
    image: universal-router:latest
    container_name: universal-router
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./config.json:/app/config.json
      - ur-data:/app/data
    environment:
      - UR_CONFIG=/app/config.json
      - UR_LOG_DB=/app/data/access.db
      - UR_BIND_HOST=0.0.0.0
      # 容器默认绑 0.0.0.0：必须在 config.json 设置 local_api_key 或 admin_api_key，否则 /v1 与 /api 锁定

volumes:
  ur-data:
